<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartDrive OS</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="main">

<div class="topbar">

<div id="clock">12:00</div>

<div>
Bluetooth • GPS • Battery 100%
</div>

</div>

<div class="dashboard">

    <div class="telemetry-left">

        <div class="info-card">
            <h3>Speed</h3>
            <p>54</p>
            <span>km/h</span>
        </div>

        <div class="info-card">
            <h3>Fuel</h3>
            <p>68</p>
            <span>%</span>
        </div>

    </div>

    <div class="vehicle-area">

        <h1>SmartDrive V1</h1>

        <img
            src="assets/images/IMG_8401.png"
            alt="Esteem"
            class="vehicle-image"
        >

        <p>Maruti Suzuki Esteem</p>

    </div>

    <div class="telemetry-right">

        <div class="info-card">
            <h3>Battery</h3>
            <p>12.6</p>
            <span>V</span>
        </div>

        <div class="info-card">
            <h3>Temp</h3>
            <p>89</p>
            <span>°C</span>
        </div>

    </div>

</div>

<div class="bottom-nav">

    <button>🏠</button>
    <button>🎵</button>
    <button>📍</button>
    <button>📞</button>
    <button>🚗</button>
    <button>🏕️</button>
    <button>⚙️</button>

</div>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartDrive OS</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="sidebar">

<div class="logo">
SmartDrive V1
</div>

<button class="nav-btn active">Home</button>
<button class="nav-btn">Music</button>
<button class="nav-btn">Maps</button>
<button class="nav-btn">Calls</button>
<button class="nav-btn">Vehicle</button>
<button class="nav-btn">Apps</button>
<button class="nav-btn">Camper</button>
<button class="nav-btn">Settings</button>

</div>

<div class="main">

<div class="topbar">

<div id="clock">12:00</div>

<div>
Bluetooth • GPS • Battery 100%
</div>

</div>

<div class="dashboard">

    <div class="hero-card">

    <h1>Vehicle Overview</h1>

    <img
        src="assets/images/IMG_8401.png"
        alt="Maruti Suzuki Esteem"
        class="vehicle-image"
    >

</div>

    <div class="bottom-widgets">

        <div class="card">
            <h2>Vehicle Status</h2>

            <p>Speed: 54 km/h</p>
            <p>Fuel: 68%</p>
            <p>Battery: 12.6V</p>

        </div>

        <div class="card">
            <h2>Music</h2>

            <p>Nothing Playing</p>

        </div>

    </div>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
